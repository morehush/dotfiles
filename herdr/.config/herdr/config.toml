onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+space"

focus_pane_left = "ctrl+h"
focus_pane_right = "ctrl+l"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

[experimental]
pane_history = false
